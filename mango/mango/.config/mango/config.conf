########################################
# MangoWM configuration
# Machine-neutral single-file config
########################################

########################################
# Monitors
########################################
# Configure your monitors here or in the DMS "Displays" settings.
# https://mangowm.github.io/docs/configuration/monitors
# Run `wlr-randr` to get your monitor information.
# Uncomment and adapt an entry like the one below if needed.
# monitorrule = name:DP-1, width:2560, height:1440, refresh:179.999, x:0, y:0, rr:0, vrr:1

########################################
# Keybinds
########################################
# Configure your keybinds here.
# https://mangowm.github.io/docs/bindings/keys

# Favorite applications
bind = SUPER, Return, spawn, foot
bind = SUPER, e, spawn, nautilus
bind = SUPER, w, spawn, librewolf
bind = SUPER+SHIFT, Return, spawn, doublecmd

# Optional editor launcher
# bind = SUPER, x, spawn, zed

bind = SUPER, q, killclient,

# Noctalia integration
bind = SUPER, d, spawn, noctalia msg panel-toggle launcher
bind = SUPER, s, spawn, noctalia msg panel-toggle control-center
bind = SUPER+SHIFT, s, spawn, noctalia msg settings-toggle
bind = SUPER+SHIFT, w, spawn, noctalia msg panel-toggle noctalia/wallhaven:browser
bind = SUPER+SHIFT, c, spawn, noctalia msg panel-toggle clipboard
bind = SUPER+SHIFT, q, spawn, noctalia msg panel-toggle session
bind = SUPER+SHIFT, b, spawn, noctalia msg bar-toggle

# Screenshots
bind = SUPER, p, spawn, noctalia msg screenshot-region
bind = SUPER+SHIFT, p, spawn, noctalia msg screenshot-fullscreen
bind = SUPER+ALT, p, spawn, noctalia msg screenshot-fullscreen all

# Reload config
bind = SUPER, r, reload_config

# Audio controls
bind = NONE, XF86AudioRaiseVolume, spawn, noctalia msg volume-up
bind = NONE, XF86AudioLowerVolume, spawn, noctalia msg volume-down
bind = NONE, XF86AudioMute, spawn, noctalia msg volume-mute

# Brightness controls
bind = NONE, XF86MonBrightnessUp, spawn, noctalia msg brightness-up
bind = NONE, XF86MonBrightnessDown, spawn, noctalia msg brightness-down

# Switch window focus
bind = SUPER, Tab, focusstack, next
bind = SUPER, Left, focusdir, left
bind = SUPER, Right, focusdir, right
bind = SUPER, Up, focusdir, up
bind = SUPER, Down, focusdir, down

# Swap windows
bind = SUPER+SHIFT, Up, exchange_client, up
bind = SUPER+SHIFT, Down, exchange_client, down
bind = SUPER+SHIFT, Left, exchange_client, left
bind = SUPER+SHIFT, Right, exchange_client, right

# Window state
bind = SUPER, g, toggleglobal,
bind = ALT, Tab, toggleoverview,
bind = SUPER, v, togglefloating,
bind = SUPER, c, centerwin,
bind = SUPER, f, togglemaximizescreen,
bind = SUPER+SHIFT, f, togglefullscreen,
bind = SUPER+ALT, f, togglefakefullscreen,
bind = SUPER, i, minimized,
bind = SUPER, o, toggleoverlay,
bind = SUPER+SHIFT, I, restore_minimized
bind = SUPER, z, toggle_scratchpad

# Scroller layout
bind = SUPER+SHIFT, e, set_proportion, 1.0
bind = SUPER, x, switch_proportion_preset,

# Switch layout
bind = SUPER, n, switch_layout
bind = SUPER+ALT, s, setlayout, scroller

# Workspaces
bind = SUPER, 1, view, 1, 0
bind = SUPER, 2, view, 2, 0
bind = SUPER, 3, view, 3, 0
bind = SUPER, 4, view, 4, 0
bind = SUPER, 5, view, 5, 0
bind = SUPER, 6, view, 6, 0
bind = SUPER, 7, view, 7, 0
bind = SUPER, 8, view, 8, 0
bind = SUPER, 9, view, 9, 0

# Move client to workspace
bind = SUPER+SHIFT, 1, tag, 1, 0
bind = SUPER+SHIFT, 2, tag, 2, 0
bind = SUPER+SHIFT, 3, tag, 3, 0
bind = SUPER+SHIFT, 4, tag, 4, 0
bind = SUPER+SHIFT, 5, tag, 5, 0
bind = SUPER+SHIFT, 6, tag, 6, 0
bind = SUPER+SHIFT, 7, tag, 7, 0
bind = SUPER+SHIFT, 8, tag, 8, 0
bind = SUPER+SHIFT, 9, tag, 9, 0

# Monitor navigation
#bind = SUPER+ALT, Left, focusmon, left
#bind = SUPER+ALT, Right, focusmon, right
#bind = SUPER+SHIFT+ALT, Left, tagmon, left
#bind = SUPER+SHIFT+ALT, Right, tagmon, right

# Gaps
#bind = SUPER+SHIFT, X, incgaps, 1
#bind = SUPER+SHIFT, Z, incgaps, -1
#bind = SUPER+SHIFT, R, togglegaps

# Move window
#bind = CTRL+SHIFT, Up, movewin, +0, -50
#bind = CTRL+SHIFT, Down, movewin, +0, +50
#bind = CTRL+SHIFT, Left, movewin, -50,+0
#bind = CTRL+SHIFT, Right, movewin, +50,+0

# Resize window
#bind = CTRL+ALT, Up, resizewin, +0, -50
#bind = CTRL+ALT, Down, resizewin, +0, +50
#bind = CTRL+ALT, Left, resizewin, -50, +0
#bind = CTRL+ALT, Right, resizewin, +50, +0

# Mouse bindings
mousebind = SUPER, btn_left, moveresize,curmove
mousebind = NONE, btn_middle, togglemaximizescreen, 0
mousebind = SUPER, btn_right, moveresize, curresize

########################################
# Input
########################################
# https://mangowm.github.io/docs/configuration/input
xkb_rules_layout = de
mouse_accel_profile = 1
mouse_accel_speed = 0.1

########################################
# Autostart
########################################
exec-once = noctalia &

########################################
# Environment
########################################
# Uncomment if you want Qt to prefer qt6ct
env = QT_QPA_PLATFORMTHEME,qt6ct
# env = QT_QPA_PLATFORMTHEME_QT6,qt6ct

########################################
# Appearance
########################################
# https://mangowm.github.io/docs/visuals

gappih = 0
gappiv = 0
gappoh = 0
gappov = 0
borderpx = 1
border_radius = 0
no_radius_when_single = 1
focused_opacity = 1.0
unfocused_opacity = 1.0

scratchpad_width_ratio = 0.8
scratchpad_height_ratio = 0.9

rootcolor = 0x201b14ff
bordercolor = 0x444444ff
focuscolor = 0x47add6ff
maximizescreencolor = 0x47add6ff
urgentcolor = 0xad401fff
scratchpadcolor = 0x516c93ff
globalcolor = 0xb153a7ff
overlaycolor = 0x14a57cff

cursor_theme = Breeze_Red
cursor_size = 32

blur = 0
blur_layer = 0
blur_optimized = 1
blur_params_num_passes = 0
blur_params_radius = 0
blur_params_noise = 0.0
blur_params_brightness = 1.0
blur_params_contrast = 1.0
blur_params_saturation = 1.0

shadows = 0
layer_shadows = 0
shadow_only_floating = 0
shadows_size = 0
shadows_blur = 0
shadows_position_x = 0
shadows_position_y = 0
shadowscolor = 0x00000000

animations = 0
layer_animations = 0
animation_type_open = zoom
animation_type_close = zoom
animation_fade_in = 0
animation_fade_out = 0
tag_animation_direction = 0
zoom_initial_ratio = 1.0
zoom_end_ratio = 1.0
fadein_begin_opacity = 1.0
fadeout_begin_opacity = 1.0
animation_duration_move = 0
animation_duration_open = 0
animation_duration_tag = 0
animation_duration_close = 0
animation_duration_focus = 0
animation_curve_open = 0.0, 0.0, 1.0, 1.0
animation_curve_move = 0.0, 0.0, 1.0, 1.0
animation_curve_tag = 0.0, 0.0, 1.0, 1.0
animation_curve_close = 0.0, 0.0, 1.0, 1.0
animation_curve_focus = 0.0, 0.0, 1.0, 1.0
animation_curve_opafadeout = 0.0, 0.0, 1.0, 1.0
animation_curve_opafadein = 0.0, 0.0, 1.0, 1.0

########################################
# Layout
########################################
# https://mangowm.github.io/docs/window-management/layouts

tagrule = id:1, layout_name:scroller
tagrule = id:2, layout_name:scroller
tagrule = id:3, layout_name:scroller
tagrule = id:4, layout_name:scroller
tagrule = id:5, layout_name:scroller
tagrule = id:6, layout_name:scroller
tagrule = id:7, layout_name:scroller
tagrule = id:8, layout_name:scroller
tagrule = id:9, layout_name:scroller

scroller_structs = 0
scroller_default_proportion = 1.0
scroller_focus_center = 0
scroller_prefer_center = 0
scroller_prefer_overspread = 1
edge_scroller_pointer_focus = 1
scroller_ignore_proportion_single = 0
scroller_default_proportion_single = 1.0
scroller_proportion_preset = 0.5, 0.8, 1.0

new_is_master = 1
default_mfact = 0.55
default_nmaster = 1
smartgaps = 0

########################################
# Rules
########################################
# https://mangowm.github.io/docs/window-management/rules

layerrule = noanim:1, noblur:1, layer_name:selection

########################################
# Miscellaneous
########################################
# https://mangowm.github.io/docs/configuration/miscellaneous

allow_tearing = 2
syncobj_enable = 1
# xwayland-persistence = 1

drag_tile_to_tile = 1
